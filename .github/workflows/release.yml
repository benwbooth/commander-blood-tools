name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  VPX_STATIC: '1'
  PKG_CONFIG_ALL_STATIC: '1'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config libvpx-dev libasound2-dev libdbus-1-dev libdecor-0-dev libdrm-dev libegl1-mesa-dev libgbm-dev libgl1-mesa-dev libibus-1.0-dev libpulse-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxrender-dev libxss-dev libxtst-dev wayland-protocols
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install libvpx pkg-config
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libvpx:x64-windows-static-md
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          cp "$root/lib/vpx.lib" "$root/lib/libvpx.lib"
          version="$("$VCPKG_INSTALLATION_ROOT/vcpkg" list libvpx | head -1 | awk '{print $2}' | sed 's/#.*//')"
          echo "VPX_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$root/include" >> "$GITHUB_ENV"
          echo "VPX_VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: .
        run: cargo build --release -p commander-blood-game --bin commander-blood --bin big-bug-bang --features sdl3/build-from-source-static
      - name: Package
        shell: bash
        run: |
          name="commander-blood-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          for bin in commander-blood big-bug-bang; do
            if [ "$RUNNER_OS" = Windows ]; then cp "target/release/$bin.exe" "dist/$name/"; else cp "target/release/$bin" "dist/$name/"; fi
          done
          for file in README.md; do [ -f "$file" ] && cp "$file" "dist/$name/"; done
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
